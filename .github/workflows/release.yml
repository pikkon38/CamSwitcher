name: Release

# Builds the installer and publishes a GitHub release. Either push a tag like v1.2.0,
# or run this workflow from the Actions tab and type the version.
# Installed copies of CamSwitch find the release through "Check for updates".
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version from tag
        id: v
        shell: pwsh
        run: |
          $v = if ("${{ inputs.version }}") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          $v = $v.TrimStart('v')
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
      - name: Publish
        run: dotnet publish src/CamSwitch/CamSwitch.csproj -c Release -o publish -p:Version=${{ steps.v.outputs.version }}
      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.v.outputs.version }} "/DSourceExe=$PWD\publish\CamSwitch.exe" installer\CamSwitch.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" "dist\CamSwitch-Setup-${{ steps.v.outputs.version }}.exe" --target "${{ github.sha }}" --title "CamSwitch ${{ steps.v.outputs.version }}" --generate-notes
